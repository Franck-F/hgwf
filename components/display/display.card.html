<!-- @dsCard group="Components" viewport="700x330" subtitle="Card · Badge · Tag · Tabs" name="Affichage" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg);padding:24px 32px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="row">
  <div style="flex:1;border:1px solid var(--hairline);border-radius:var(--radius-md);padding:18px">
    <div style="font-weight:700;font-size:16px">Carte standard</div>
    <div style="font-size:13px;color:var(--fg-muted);margin-top:4px">Trait fin 1px, sans ombre.</div>
  </div>
  <div style="flex:1;background:var(--bg-premium);color:var(--fg-on-dark);border-radius:var(--radius-lg);padding:18px">
    <div style="font-weight:700;font-size:16px">Carte premium</div>
    <div style="font-size:13px;opacity:.8;margin-top:4px">Badge marine, rayon 24.</div>
  </div>
</div>
<div class="row">
  <span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-sm);background:var(--hgwf-marine);color:var(--hgwf-creme)">À quai</span>
  <span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-sm);background:var(--hgwf-ciel-lagune);color:var(--hgwf-marine)">En mer</span>
  <span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-sm);background:var(--hgwf-corail-nacre);color:color-mix(in srgb,var(--hgwf-corail) 75%,var(--hgwf-marine))">Retard</span>
  <span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-sm);background:var(--hgwf-or-sable);color:color-mix(in srgb,var(--hgwf-or) 45%,var(--hgwf-marine))">Prioritaire</span>
  <span style="font-family:var(--font-mono);font-size:12px;padding:4px 10px;border-radius:var(--radius-sm);background:var(--hgwf-marine);color:var(--hgwf-creme)">MSKU 907 214 3</span>
  <span style="font-size:13px;padding:4px 12px;border-radius:var(--radius-pill);border:1px solid var(--hairline);background:var(--bg-soft)">Reefer</span>
  <span style="font-size:13px;padding:4px 12px;border-radius:var(--radius-pill);border:1px solid var(--hairline);background:var(--bg-soft);display:inline-flex;align-items:center;gap:6px">Le Havre <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="var(--fg-muted)" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
</div>
<div style="display:flex;border-bottom:1px solid var(--hairline)">
  <span style="padding:10px 16px;font-weight:700;font-size:14px;box-shadow:inset 0 -2px 0 var(--accent)">En mer</span>
  <span style="padding:10px 16px;font-size:14px;color:var(--fg-muted)">À quai</span>
  <span style="padding:10px 16px;font-size:14px;color:var(--fg-muted)">Livrés</span>
</div>
</body></html>
