<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg);padding:24px 32px;display:flex;gap:24px;align-items:flex-start}</style></head>
<body>
<div style="flex:1.3;background:var(--bg);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-quai)">
  <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:var(--tracking-tight)">Annuler la réservation.</h2>
  <p style="font-size:14px;line-height:1.5;margin:12px 0 18px;color:var(--fg-muted)">Le créneau au Havre sera libéré.</p>
  <div style="display:flex;gap:12px;justify-content:flex-end">
    <button style="font-family:inherit;font-weight:500;font-size:14px;background:none;border:none;color:var(--accent);padding:9px 12px">Retour</button>
    <button style="font-family:inherit;font-weight:500;font-size:14px;background:var(--accent);color:var(--hgwf-creme);border:none;border-radius:var(--radius-md);padding:9px 18px">Confirmer</button>
  </div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div style="background:var(--bg-premium);color:var(--fg-on-dark);border-radius:var(--radius-md);padding:14px 18px;display:flex;gap:12px">
    <span style="width:8px;height:8px;border-radius:50%;background:var(--hgwf-or);margin-top:6px;flex-shrink:0"></span>
    <div><div style="font-weight:700;font-size:14px">À quai.</div><div style="font-size:14px;opacity:.85">MSKU 907 214 3 déchargé au Havre.</div></div>
  </div>
  <div style="display:inline-flex;flex-direction:column;align-items:center;gap:8px;align-self:flex-start">
    <span style="background:var(--bg-premium);color:var(--fg-on-dark);font-size:12px;padding:6px 10px;border-radius:var(--radius-sm)">Copier le numéro</span>
    <span style="width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--hairline);border-radius:var(--radius-md)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span>
  </div>
</div>
</body></html>
