<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:48px;height:250px;font-family:var(--font-display);color:var(--fg)}
.l{font-size:9px;letter-spacing:0.3em;color:var(--fg-muted);text-transform:uppercase;text-align:center;margin-top:10px}</style></head>
<body>
<div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <img src="../assets/logos/embleme.svg" width="80" height="80" alt="">
    <span style="font-weight:700;font-size:20px">HGWF</span>
    <span style="font-weight:500;font-size:9px;letter-spacing:0.42em;color:var(--hgwf-or)">CARGO</span>
  </div>
  <div class="l">Empilé</div>
</div>
<div>
  <img src="../assets/logos/embleme.svg" width="104" height="104" alt="" style="display:block">
  <div class="l">Emblème seul</div>
</div>
<div>
  <div style="display:inline-flex;align-items:center;gap:14px;background:var(--hgwf-creme);border:1px solid var(--hairline);border-radius:18px;padding:12px 20px">
    <img src="../assets/logos/marque-sur-clair.svg" width="52" height="52" alt="">
    <div style="display:flex;flex-direction:column;gap:1px">
      <span style="font-weight:700;font-size:22px;line-height:1">HGWF</span>
      <span style="font-weight:500;font-size:9px;letter-spacing:0.42em;color:var(--hgwf-or)">CARGO</span>
    </div>
  </div>
  <div class="l">Renversé</div>
</div>
<div>
  <div style="display:inline-flex;align-items:center;gap:14px">
    <img src="../assets/logos/marque-mono.svg" width="60" height="60" alt="">
    <div style="display:flex;flex-direction:column;gap:1px">
      <span style="font-weight:700;font-size:22px;line-height:1">HGWF</span>
      <span style="font-weight:500;font-size:9px;letter-spacing:0.42em">CARGO</span>
    </div>
  </div>
  <div class="l">Monochrome</div>
</div>
</body></html>
