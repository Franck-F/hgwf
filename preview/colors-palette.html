<!-- @dsCard group="Colors" viewport="700x170" subtitle="Palette fermée — 6 couleurs extraites du logo 1D" name="Palette" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);height:170px;display:flex;align-items:center;gap:12px;padding:0 24px;font-family:var(--font-mono);font-size:11px}
.s{flex:1;height:110px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-family:var(--font-body);font-weight:500;font-size:12px}</style></head>
<body>
<div class="s" style="background:var(--hgwf-marine);color:var(--hgwf-creme)"><span class="n">Marine</span>#12395B</div>
<div class="s" style="background:var(--hgwf-ciel);color:var(--hgwf-marine)"><span class="n">Ciel</span>#4EA8DE</div>
<div class="s" style="background:var(--hgwf-corail);color:var(--hgwf-creme)"><span class="n">Corail</span>#FF6F5E</div>
<div class="s" style="background:var(--hgwf-or);color:var(--hgwf-marine)"><span class="n">Or</span>#FFB23E</div>
<div class="s" style="background:var(--hgwf-creme);color:var(--hgwf-marine);border:1px solid var(--hairline)"><span class="n">Crème</span>#FBF4E6</div>
<div class="s" style="background:var(--hgwf-ivoire);color:var(--hgwf-marine);border:1px solid var(--hairline)"><span class="n">Ivoire</span>#FFFDF8</div>
</body></html>
