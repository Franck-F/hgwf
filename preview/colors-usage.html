<!-- @dsCard group="Colors" viewport="700x190" subtitle="Ivoire par défaut · marine premium · corail pour l'action · or en highlight" name="Usage" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);height:190px;display:flex;gap:16px;padding:20px 24px;box-sizing:border-box;font-family:var(--font-body)}</style></head>
<body>
<div style="flex:1;border:1px solid var(--hairline);border-radius:var(--radius-md);padding:18px;color:var(--fg)">
  <div style="font-size:11px;letter-spacing:0.32em;color:var(--fg-muted);font-weight:500">SURFACE IVOIRE</div>
  <p style="font-size:14px;line-height:1.5;margin:10px 0 14px;color:var(--fg)">Texte marine, secondaire <span style="color:var(--fg-muted)">encre douce</span>.</p>
  <button style="font-family:inherit;font-weight:500;font-size:14px;background:var(--accent);color:var(--hgwf-creme);border:none;border-radius:var(--radius-md);padding:9px 18px">Action corail</button>
</div>
<div style="flex:1;background:var(--bg-premium);border-radius:var(--radius-lg);padding:18px;color:var(--fg-on-dark)">
  <div style="font-size:11px;letter-spacing:0.32em;color:var(--hgwf-or);font-weight:500">SURFACE MARINE</div>
  <p style="font-size:14px;line-height:1.5;margin:10px 0 14px">Texte crème, highlight <span style="color:var(--hgwf-or)">or</span>, data <span style="color:var(--hgwf-ciel)">ciel</span>.</p>
  <button style="font-family:inherit;font-weight:500;font-size:14px;background:transparent;color:var(--fg-on-dark);border:1.5px solid var(--hairline-dark);border-radius:var(--radius-md);padding:9px 18px">Secondaire</button>
</div>
</body></html>
