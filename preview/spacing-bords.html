<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Trait fin 1px · rayons 6/12/24 · une seule ombre (quai)" name="Bords & rayons" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);height:170px;display:flex;align-items:center;gap:20px;padding:0 48px;font-family:var(--font-body);font-size:12px;color:var(--fg-muted)}
.b{height:96px;flex:1;border:1px solid var(--hairline);background:var(--bg);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box}</style></head>
<body>
<div class="b" style="border-radius:var(--radius-sm)">sm · 6px</div>
<div class="b" style="border-radius:var(--radius-md)">md · 12px</div>
<div class="b" style="border-radius:var(--radius-lg)">lg · 24px — le rayon du badge</div>
<div class="b" style="border-radius:var(--radius-md);border:none;background:var(--bg-soft);box-shadow:var(--shadow-quai)">shadow-quai</div>
</body></html>
