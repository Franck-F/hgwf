<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);height:150px;display:flex;align-items:center;gap:12px;padding:0 24px;font-family:var(--font-body);font-size:12px;color:var(--fg)}
.s{flex:1;height:90px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;border:1px solid var(--hairline)}</style></head>
<body>
<div class="s" style="background:var(--hgwf-marine-abysse);color:var(--hgwf-creme);border:none">marine-abysse</div>
<div class="s" style="background:var(--hgwf-encre-douce);color:var(--hgwf-creme);border:none">encre-douce</div>
<div class="s" style="background:var(--hgwf-ciel-lagune)">ciel-lagune</div>
<div class="s" style="background:var(--hgwf-corail-nacre)">corail-nacre</div>
<div class="s" style="background:var(--hgwf-or-sable)">or-sable</div>
</body></html>
